# ============================================================
# CI/CD Pipeline — POS-Coffee
# ============================================================
# TRIGGER RULE:
#   This workflow runs ONLY when README.md is pushed to main.
#   It does NOT run on normal feature pushes, PRs, or any
#   other file changes. This is intentional — README.md is
#   committed by the Developer Agent as the final release
#   step, signaling the project is ready for production.
# ============================================================

name: CI/CD — Deploy on README push

on:
  push:
    branches:
      - main
    paths:
      - "README.md" # Only trigger when README.md is pushed to main

# Prevent concurrent deployments if README is pushed twice quickly
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1 — TEST (CI)
  # Validates the codebase before any deployment is attempted.
  # ──────────────────────────────────────────────────────────
  test:
    name: Test — Type Check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (next build)
        run: npm run build
        env:
          # Suppress Next.js telemetry during CI
          NEXT_TELEMETRY_DISABLED: 1

  # ──────────────────────────────────────────────────────────
  # JOB 2 — DEPLOY (CD)
  # Deploys to Vercel Production only after Test passes.
  # Uses Vercel CLI for a direct production deployment.
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy — Vercel Production
    runs-on: ubuntu-latest
    needs: test # Only runs if the test job succeeds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project via Vercel CLI
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOYMENT_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Print deployment URL
        run: echo "Production deployment successful — ${{ steps.deploy.outputs.deployment-url }}"
